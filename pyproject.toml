[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peach-app"
dynamic = ["version"]
description = "Local-first media library, behavior ledger, and discovery application"
requires-python = ">=3.14"
dependencies = [
  "APScheduler==3.11.3",
  "beautifulsoup4==4.15.0",
  "browserexport==0.4.4",
  "curl_cffi==0.16.2",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pystray==0.19.5",
  "pydantic==2.13.5",
  "resvg-py==0.5.0",
  "socksio==1.0.0",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "zeroconf==0.151.3",
]

[project.scripts]
peach = "peach.cli:main"
peach-tray = "peach.tray:main"

[project.optional-dependencies]
build = ["pyinstaller==6.22.2"]
macos = ["pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'"]
vision = ["opencv-python-headless==5.0.0.93"]
maintenance-115 = ["p115client==0.0.9.6.5.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "peach.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
