[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "peach-app"
dynamic = ["version"]
description = "Local-first media library, behavior ledger, and discovery application"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.15.0",
  "fastapi==0.116.1",
  "feedparser==6.0.12",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pystray==0.19.5",
  "pydantic==2.13.4",
  "starlette==0.47.3",
  "uvicorn==0.35.0",
  "zeroconf==0.150.0",
]

[project.scripts]
peach = "peach.cli:main"
peach-tray = "peach.tray:main"

[project.optional-dependencies]
build = ["pyinstaller==6.22.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "peach.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
