name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Windows runner 的 stdout 默认按本机 ANSI（cp1252）编码，而项目里的脚本和错误
# 消息大量是中文——`print(f"首尾帧审计失败：{error}")` 在 runner 上直接抛
# UnicodeEncodeError，15 个脚本类用例因此全红，本地却全绿。
#
# `tests/test_subprocess_encoding.py` 已经把这条口径写死过一次：「由 Peach 控制的
# 子进程还必须用 PYTHONIOENCODING=utf-8 固定输出端」。CI 缺的正是这一层——那条
# 测试管的是源码里怎么调 subprocess，管不到 runner 自己的 stdout。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      wheel_matrix: ${{ steps.plan.outputs.wheel_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 生成验证矩阵
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: uv run --locked --python 3.14 scripts/ci_plan.py --event "$EVENT_NAME" --base "$BASE_SHA"

  wheel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv build --wheel --out-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-smoke
          path: |
            wheelhouse/*.whl
            scripts/smoke_wheel.py
  wheel-smoke:
    name: wheel 最小安装 / ${{ matrix.os }} / ${{ matrix.python }}
    needs: [plan, wheel-build]
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.wheel_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel-smoke
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 安装正式 wheel
        shell: bash
        run: |
          python -m pip install --no-cache-dir wheelhouse/*.whl
          python -m pip check
      - name: 源码树外冒烟
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.scope }} / ${{ matrix.shard_index }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装 Windows 依赖
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv sync --locked --all-extras --python python
          if ($LASTEXITCODE -ne 0) { throw 'uv 锁定安装失败' }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { throw 'uv 依赖检查失败' }
      - name: 运行 Windows 正式测试
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\scripts\test.ps1 -Scope ${{ matrix.scope }} -Fresh -Base $env:BASE_SHA -ShardIndex ${{ matrix.shard_index }} -ShardCount ${{ matrix.shard_count }}'
      - name: 安装 macOS 依赖
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv sync --locked --all-extras --python python
          uv pip check --python .venv/bin/python
      - name: 运行 macOS 正式测试
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/test.sh ${{ matrix.scope }} --fresh --base "$BASE_SHA" --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}

  web-bundle:
    name: island 产物与前端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      # 产物提交进 Git，因为运行时和打包都没有 Node（ADR-0022）。一旦源码改了却忘了
      # 重新构建并提交，服务端发出去的就还是旧 island——本地跑测试也看不出来，只有
      # 在这里比一次才拦得住。
      #
      # 先 `git add -N`：光 `git diff` 只看已跟踪的文件，构建新出的产物（某个 island
      # 开始带自己的 CSS 就会多一份 peach-ui.css）是未跟踪的，那条门槛会直接放过去。
      - name: 核对 web/dist 与源码一致
        run: |
          git add --intent-to-add -- web/dist
          git diff --exit-code -- web/dist
      # 与下面 web-vendor 的 audit 同一口径：advisories 端点偶发 503，退避重试三次。
      - name: npm audit (frontend)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm --prefix frontend audit --audit-level=high && exit 0
            echo "npm audit 第 ${attempt} 次未成功，60 秒后重试"
            sleep 60
          done
          exit 1

  web-vendor:
    name: 固定前端依赖
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:vendor
      # 审计结果来自 registry.npmjs.org 的 advisories 端点，它偶发 503；
      # 退避重试三次，仍失败才算红——那时是真的查不到，不是本仓库的问题。
      - name: npm audit
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            echo "npm audit 第 ${attempt} 次未成功，60 秒后重试"
            sleep 60
          done
          exit 1

  verified:
    name: 完整验证结果
    if: always()
    needs: [plan, python, wheel-smoke, web-bundle, web-vendor]
    runs-on: ubuntu-latest
    steps:
      - name: 所有必需任务均成功
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json, os; results=json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
