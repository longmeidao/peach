name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Windows runner 的 stdout 默认按本机 ANSI（cp1252）编码，而项目里的脚本和错误
# 消息大量是中文——`print(f"首尾帧审计失败：{error}")` 在 runner 上直接抛
# UnicodeEncodeError，15 个脚本类用例因此全红，本地却全绿。
#
# `tests/test_subprocess_encoding.py` 已经把这条口径写死过一次：「由 Peach 控制的
# 子进程还必须用 PYTHONIOENCODING=utf-8 固定输出端」。CI 缺的正是这一层——那条
# 测试管的是源码里怎么调 subprocess，管不到 runner 自己的 stdout。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # 只测两端：3.12 是 `requires-python` 对外声明的下限，陌生用户按它装；
        # 3.14 是维护者两台机器实际运行的版本。中间的 3.13 不测——源码没有用到
        # 3.13 独有的特性，两端都绿时它红的概率不值一个 job。
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          check-latest: true

      - name: 安装 Windows 依赖
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install --upgrade pip
          & .\.venv\Scripts\python.exe -m pip install -e ".[build,vision,maintenance-115,naming]"
          & .\.venv\Scripts\python.exe -m pip check

      - name: 运行 Windows 正式测试
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\scripts\test.ps1'

      - name: 安装 macOS 依赖
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -e ".[build,macos,vision,maintenance-115,naming]"
          ./.venv/bin/python -m pip check

      - name: 运行 macOS 正式测试
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/test.sh

  web-bundle:
    name: island 产物与前端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      # 产物提交进 Git，因为运行时和打包都没有 Node（ADR-0022）。一旦源码改了却忘了
      # 重新构建并提交，服务端发出去的就还是旧 island——本地跑测试也看不出来，只有
      # 在这里比一次才拦得住。
      #
      # 先 `git add -N`：光 `git diff` 只看已跟踪的文件，构建新出的产物（某个 island
      # 开始带自己的 CSS 就会多一份 peach-ui.css）是未跟踪的，那条门槛会直接放过去。
      - name: 核对 web/dist 与源码一致
        run: |
          git add --intent-to-add -- web/dist
          git diff --exit-code -- web/dist
      - run: npm --prefix frontend audit --audit-level=high

  web-vendor:
    name: 固定前端依赖
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:vendor
      - run: npm audit --audit-level=high
