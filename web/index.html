  <button class="ib" id="immerseBtn" title="沉浸模式 · 随机连播" aria-label="进入沉浸模式"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-play"/></svg></button>

  <button class="ib" id="searchBtn" title="搜索" aria-label="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg></button>
  <button class="ib" id="selectMode" title="多选（Ctrl 单项，Shift 连续）" aria-label="多选模式" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-square-check-big"/></svg></button>
  <button class="ib" id="density" title="密度：大图 / 密集" aria-label="切换卡片密度"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-layout-grid"/></svg></button>
  <button class="ib" id="settingsBtn" title="设置" aria-label="打开设置"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg></button>

</header>

<div class="tiers" id="tiers"></div>
<div class="tagbar" id="tagbar"></div>
<div class="javbar" id="javbar" hidden></div>
<nav class="edge" id="edge"></nav>

<main id="main" tabindex="-1">
  <section class="stage" id="stage" hidden></section>
  <div class="combo" id="combo"></div>
  <section class="index" id="index" hidden></section>
  <nav class="managebar" id="managebar" hidden></nav>
  <h2 class="disp listtitle" id="listTitle" hidden></h2>
  <h2 class="disp managetitle" id="manageTitle" hidden></h2>
  <p class="pagelede mono" id="manageLede" hidden></p>
  <section class="stats" id="stats" hidden></section>
  <div class="count mono" id="count" role="status" aria-live="polite" aria-atomic="true">载入中…</div>
  <div class="grid" id="grid"></div>
  <section class="shorts" id="shortsSec" hidden>
    <h2 class="disp">竖屏 <span class="mono" style="color:var(--muted);font-size:11px" id="shortsN"></span>
      <button id="tokBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-play"/></svg><span>进入沉浸模式</span></button></h2>
    <div class="srow" id="srow"></div>
  </section>
  <div class="loadmore mono" id="loadSentinel" hidden>继续载入中…</div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="batchbar" id="batchbar" hidden><span id="batchCount">已选 0 项</span>
  <button data-batch="like"><svg viewBox="0 0 24 24"><use href="#i-thumbs-up"/></svg>喜欢</button><button data-batch="seen"><svg viewBox="0 0 24 24"><use href="#i-eye"/></svg>看过</button><button data-batch="later"><svg viewBox="0 0 24 24"><use href="#i-bookmark-plus"/></svg>稍后看</button>
  <button class="danger" data-batch="dispose"><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg>加入回收站</button><button data-trash-only data-batch="restore"><svg viewBox="0 0 24 24"><use href="#i-rotate-ccw"/></svg>还原</button><button class="danger" data-trash-only data-batch="delete"><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg>彻底删除</button>
  <button data-junk-batch="dismiss-junk" hidden><svg viewBox="0 0 24 24"><use href="#i-check"/></svg>不是垃圾</button><button data-junk-batch="reconsider-junk" hidden><svg viewBox="0 0 24 24"><use href="#i-rotate-ccw"/></svg>重新判断</button><button class="danger" data-junk-batch="dispose" hidden><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg>移入回收站</button>
  <button id="followBatchAll" data-follow-control hidden><svg viewBox="0 0 24 24"><use href="#i-square-check-big"/></svg>全选当前</button><button data-follow-batch="save" hidden><svg viewBox="0 0 24 24"><use href="#i-bookmark-plus"/></svg>保存到账本</button><button data-follow-batch="seen" hidden><svg viewBox="0 0 24 24"><use href="#i-eye"/></svg>标记已看</button><button data-follow-batch="ignored" hidden><svg viewBox="0 0 24 24"><use href="#i-eye-off"/></svg>忽略</button>
  <button id="batchClear"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg>取消</button></div>

<div class="tok" id="tok" hidden>
  <div class="tokstage">
    <div class="toktrack" id="tokTrack"><video id="tokVid" playsinline></video></div>
    <div class="tokbtns">
      <div class="tokaction"><button id="tokDislike" title="标为不喜欢" aria-label="标为不喜欢"><svg viewBox="0 0 24 24"><use href="#i-thumbs-down"/></svg></button><span class="toklabel">不喜欢</span></div>
      <div class="tokaction"><button id="tokSeen" title="标为看过" aria-label="标为看过"><svg viewBox="0 0 24 24"><use href="#i-eye"/></svg></button><span class="toklabel" id="tokSeenLabel">看过</span></div>
      <div class="tokaction"><button id="tokO" title="记一次高潮" aria-label="记一次高潮"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg></button><span class="toklabel">高潮 <b id="tokOn">0</b></span></div>
    </div>
  </div>
  <div class="tokloading" id="tokLoader" role="status" aria-live="polite" hidden><span class="tokspinner" aria-hidden="true"></span><span id="tokLoadingText">加载中…</span></div>
  <div class="tokhint mono">滚轮 / ↑↓ 切换 · Esc 退出 · 横竖屏混流</div>
  <button class="tokclose" id="tokClose" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
  <div class="tokbar" id="tokBar"><i id="tokProg"></i></div>
  <div class="tokui">
    <div class="tokauthor"><button type="button" class="tokavatar" id="tokAvatar" aria-label="打开资料"></button><a href="#" id="tokWho"></a><span id="tokMeta"></span></div>
    <button type="button" class="toktitle" id="tokTitle"></button>
  </div>
</div>

<section class="settingspanel" id="settingsPanel" hidden aria-modal="true" role="dialog" aria-labelledby="settingsTitle">
  <div class="settingscard">
    <div class="settingshead"><h2 id="settingsTitle">设置</h2><button id="settingsClose" aria-label="关闭设置"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
    <div class="settingsscroll">
      <section class="settinggroup"><h3>浏览</h3>
      <label class="settingrow"><span><b>每批作品</b><small>首页每次加载的作品数量。</small></span><select id="batchSizeSetting"><option value="30">30 个</option><option value="60">60 个</option><option value="90">90 个</option></select></label>
      <label class="settingrow"><span><b>默认排序</b><small>打开首页时使用的排序。</small></span><select id="defaultSortSetting"><option value="seed">随机</option><option value="rating">评分</option><option value="o">高潮计数</option><option value="plays">观看次数</option><option value="long">时长</option><option value="big">体积</option><option value="new">最近入库</option><option value="played">最近看的</option></select></label>
      <label class="settingrow"><span><b>悬停放大</b><small>转圈完成后进入放大预览。</small></span><select id="hoverDelaySetting"><option value="3">3 秒</option><option value="5">5 秒</option><option value="8">8 秒</option></select></label>
      </section>
      <section class="settinggroup"><h3>播放</h3>
      <label class="settingrow"><span><b>快进 / 快退</b><small>卡片预览和详情播放器共用。</small></span><select id="seekSecondsSetting"><option value="5">5 秒</option><option value="10">10 秒</option><option value="30">30 秒</option></select></label>
      <label class="settingrow"><span><b>相关推荐</b><small>详情下方一次显示的相似作品数量。</small></span><select id="relatedLimitSetting"><option value="12">12 个</option><option value="20">20 个</option><option value="30">30 个</option></select></label>
      </section>
      <section class="settinggroup"><h3>搜索</h3>
      <label class="settingrow"><span><b>搜索记录</b><small>保存在 Peach 账本，所有访问端同步。</small></span><select id="searchHistoryLimitSetting"><option value="5">最近 5 条</option><option value="10">最近 10 条</option><option value="20">最近 20 条</option></select></label>
      </section>
      <section class="settinggroup"><h3>关注</h3>
      <label class="settingrow"><span><b>关注自动更新</b><small id="followScheduleState" aria-live="polite">读取运行状态…</small></span><select id="followScheduleSetting"><option value="0">关闭</option><option value="15">每 15 分钟</option><option value="30">每 30 分钟</option><option value="60">每小时</option><option value="180">每 3 小时</option><option value="360">每 6 小时</option><option value="720">每 12 小时</option><option value="1440">每天</option></select></label>
      </section>
      <section class="settinggroup"><h3>界面</h3>
      <section class="sidebarsetting" aria-labelledby="sidebarOrderTitle"><span><b id="sidebarOrderTitle">左侧导航</b><small>直接拖动排序；可隐藏入口，也可从具体页面列表重新添加。窄栏和筛选抽屉会保持一致。</small></span><div class="sidebarorder" id="sidebarOrderSetting"></div></section>
      </section>
      <section class="settinggroup"><h3>安全</h3>
      <label class="settingrow"><span><b>审查遮挡</b><small>共享屏幕或截图前开启，遮住全站封面与预览图。默认关闭；只在用会审查内容的模型做测试时需要。</small></span><input type="checkbox" id="censorSetting"></label>
      </section>
</section>
    </div>
  </div>
</section>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="/vendor/videojs/8.24.0/video.min.js"></script>
<script src="/vendor/videojs/8.24.0/lang/zh-CN.js"></script>
